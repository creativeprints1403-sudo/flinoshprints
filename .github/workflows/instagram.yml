name: Instagram posts

on:
  schedule:
    - cron: "30 13 * * 1,3,5"  # Mon, Wed, Fri at 19:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency: instagram

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the next due post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 scripts/post_instagram.py
      - name: Record what was posted
        run: |
          if [ -n "$(git status --porcelain social/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add social/
            git commit -m "Record Instagram post"
            git push
          fi
