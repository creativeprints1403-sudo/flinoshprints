name: Instagram posts

on:
  schedule:
    # GitHub often runs schedules late or drops them, so this checks every
    # 30 minutes (8:43 am to 10:13 pm IST) and posts when a slot in IG_SLOTS is due.
    - cron: "13,43 3-16 * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only check the connection, don't post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: instagram

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the next due post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CHECK_ONLY: ${{ inputs.check_only }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          IG_SLOTS: "09:00,11:00,13:00,15:00,17:00,19:00,20:30,21:30"
        run: python3 scripts/post_instagram.py
      - name: Record what was posted
        run: |
          if [ -n "$(git status --porcelain social/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add social/
            git commit -m "Record Instagram post"
            git pull --rebase -q origin main
            git push
          fi
