name: Build reels

on:
  push:
    branches: [main]
    paths: ["social/reels.json", "scripts/make_reel.py", "scripts/make_post_cards.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: reels

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install ffmpeg, fonts and Pillow
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python3 -m pip install --quiet pillow
      - name: Build reels not built yet
        run: |
          # a change to the design rebuilds everything, otherwise only what's missing
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q -E "scripts/make_(post_cards|reel)\.py"; then
            python3 scripts/make_reel.py --all
          else
            python3 scripts/make_reel.py
          fi
      - name: Commit new reels
        run: |
          if [ -n "$(git status --porcelain assets/reels/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add assets/reels/
            git commit -m "Build reels"
            git pull --rebase -q origin main
            git push
          fi
