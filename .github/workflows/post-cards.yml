name: Build post cards

on:
  push:
    branches: [main]
    paths: ["social/instagram-products.json", "scripts/make_post_cards.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: post-cards

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fonts and Pillow
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fonts-liberation fonts-inter
          python3 -m pip install --quiet pillow
      - name: Build cards not built yet
        run: python3 scripts/make_post_cards.py
      - name: Commit new cards
        run: |
          if [ -n "$(git status --porcelain assets/ig/ social/instagram-products.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add assets/ig/ social/instagram-products.json
            git commit -m "Build premium post cards"
            git pull --rebase -q origin main
            git push
          fi
