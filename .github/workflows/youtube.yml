name: YouTube uploads

on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST
    - cron: "0 7 * * *"    # 12:30 IST
    - cron: "30 9 * * *"   # 15:00 IST
    - cron: "30 12 * * *"  # 18:00 IST
    - cron: "30 14 * * *"  # 20:00 IST
    - cron: "0 16 * * *"   # 21:30 IST (GitHub runs these late; Claude also dispatches)
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only check the connection, don't upload"
        type: boolean
        default: false
      per_day:
        description: "Daily upload cap for this run (default 6)"
        type: string
        default: "6"

permissions:
  contents: write

concurrency: youtube

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload the next due video
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CHECK_ONLY: ${{ inputs.check_only }}
          YT_PER_DAY: ${{ inputs.per_day || '6' }}
        run: python3 scripts/post_youtube.py
      - name: Record what was uploaded
        if: always()
        run: |
          if [ -n "$(git status --porcelain social/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add social/
            git commit -m "Record YouTube upload"
            git pull --rebase -q origin main
            git push
          fi
